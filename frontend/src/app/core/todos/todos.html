<h2>My Todos</h2>

<div class="row">
  @for (todo of todoCollection; track $index) {
    <div class="col">
      <div class="card">
        <div class="card-body text-center">
          <h5>{{ todo.label | uppercase }}</h5>

          <button class="btn btn-sm btn-outline-danger">Delete</button>
        </div>
      </div>
    </div>
  }
</div>
