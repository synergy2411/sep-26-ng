<h2 class="text-center">My Todos</h2>

<!-- Accept user input -->
<div class="row mb-4">
  <div class="col-8 offset-2">
    <app-todo-form (addTodoEvent)="onAdd($event)"></app-todo-form>
  </div>
</div>

<!-- Display all todos -->
<div class="row">
  @for (todo of todoCollection; track $index) {
    <div class="col-4">
      <app-todo-item [todo]="todo" (deleteTodoEvent)="onDelete($event)"></app-todo-item>
    </div>
  }
</div>
